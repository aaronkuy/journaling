<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journaling App</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
</head>

<body>

<header>
    <h1>Journaling App</h1>
    <div>
        <button class="add-entry-btn" data-action="new-entry">+ New Entry</button>
        <button id="themeToggleBtn" class="theme-toggle-btn" data-action="toggle-theme" aria-label="Switch to dark theme">☾</button>
    </div>
</header>

<main id="entriesContainer" class="entries-grid">

</main>

<footer class="footer">
    A practice project by <a href="https://github.com/aaronkuy">Aaron Kuyucu</a> · <a href="https://github.com/aaronkuy/journaling#credits">Credits</a> · <a href="https://github.com/aaronkuy/journaling">Source on GitHub</a>
</footer>

<dialog id="entryDialog" aria-labelledby="dialogTitle">

    <div class="dialog-content">

        <div class="dialog-header">
            <h2 class="dialog-title" id="dialogTitle">Add New Entry</h2>
            <button type="button" class="close-btn" data-action="close-dialog" aria-label="Close">×</button>
        </div>

        <form id="entryForm">

            <div class="form-group">
                <label for="entryTitle" class="form-label">Title</label>
                <input type="text" id="entryTitle" class="form-input" placeholder="Title of your day..." required>
            </div>

            <div class="form-group">
                <label for="entryContent" class="form-label">Thoughts</label>
                <textarea id="entryContent" class="form-textarea" placeholder="How was your day?" required></textarea>
            </div>

            <div class="dialog-actions">
                <button type="button" class="cancel-btn" data-action="close-dialog">Cancel</button>
                <button type="submit" class="save-btn">Save Entry</button>
            </div>

        </form>

    </div>

</dialog>

<template id="entryCardTemplate">
    <div class="entry-card">
        <h3 class="entry-title"></h3>
        <p class="entry-content"></p>
        <div class="entry-actions">
            <button class="edit-btn" data-action="edit-entry" title="Edit entry" aria-label="Edit entry">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
                </svg>
            </button>
            <button class="delete-btn" data-action="delete-entry" title="Delete entry" aria-label="Delete entry">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M18.3 5.71c-.39-.39-1.02-.39-1.41 0L12 10.59 7.11 5.7c-.39-.39-1.02-.39-1.41 0-.39.39-.39 1.02 0 1.41L10.59 12 5.7 16.89c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0L12 13.41l4.89 4.88c.39.39 1.02.39 1.41 0 .39-.39.39-1.02 0-1.41L13.41 12l4.89-4.89c.38-.38.38-1.02 0-1.4z"/>
                </svg>
            </button>
        </div>
    </div>
</template>

<template id="emptyStateTemplate">
    <div class="empty-state">
        <h2>Journal is empty</h2>
        <p>Write about your day to get started!</p>
        <button class="add-entry-btn" data-action="new-entry">+ Create First Entry</button>
    </div>
</template>

</body>
</html>
